[project]
name = "alphadesk"
version = "0.1.0"
description = "Explainable equity & options research engine"
requires-python = ">=3.10"
dependencies = []   # core runs on the standard library; live adapters add their own

[project.optional-dependencies]
# Claude filing reader (Task #4). Optional — without it the engine uses the
# heuristic. `pip install -e .[llm]`.
llm = ["anthropic>=0.69.0"]

[project.scripts]
alphadesk = "alphadesk.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
