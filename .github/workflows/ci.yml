# .github/workflows/ci.yml
# CI gate for VolTradeAI. Runs on every push to main and every PR.
# Railway should deploy only after this passes (enable "Wait for CI"
# in Railway service settings → GitHub → Check Suites).
#
# MINUTE BUDGET (human-directed 2026-07-10, explicit override of the
# FROZEN-PATH rule for .github/workflows/): we hit the 2,000-minute cap, so
# this workflow is tuned to spend the fewest minutes that still fully gates
# a merge. Three levers, none of which weakens a test:
#   1. concurrency — cancel superseded PR runs (repeated pushes) so only the
#      latest commit is built. main pushes are never cancelled (they gate the
#      Railway deploy).
#   2. docker layer cache (buildx + actions/cache) — a cold ~3-min image build
#      restores unchanged layers instead of rebuilding from scratch.
#   3. a fast `changes` job path-filters the heavy jobs: docs-only,
#      research-only, and tile-only PRs skip python/node/docker entirely.
# The auto-merge gate treats a SKIPPED heavy job as "nothing to check" (OK to
# merge) but a FAILED or CANCELLED one as blocking — so skipping never merges
# past a real failure.
#
# DEPENDENCY NOTE: uses ONLY GitHub-owned actions (actions/*). Change
# detection is plain `git diff` and docker caching is `docker buildx` +
# actions/cache, so no third-party-action allow-list policy can break CI
# (an earlier revision using dorny/paths-filter failed at action resolution).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One active run per ref. Cancel superseded PR runs to reclaim minutes;
  # never cancel a main-branch run (it gates a deploy already in flight).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Cheap (~15s) path detection that decides which heavy jobs must run.
    # Pure git — no third-party actions.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base=$(git merge-base "origin/$BASE_REF" HEAD)
            files=$(git diff --name-only "$base" HEAD)
          else
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              files=$(git ls-files)
            else
              files=$(git diff --name-only "$BEFORE" HEAD)
            fi
          fi
          echo "changed files:"; echo "$files"
          set_out() {
            if printf '%s\n' "$files" | grep -Eq "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # A change to THIS workflow re-runs everything (safe default).
          # client/public/** (static tiles/assets) is deliberately excluded
          # from node/docker: it is copied verbatim into the bundle/image and
          # can neither break a build nor a test.
          if printf '%s\n' "$files" | grep -Eq '^\.github/workflows/ci\.yml$'; then
            { echo "python=true"; echo "node=true"; echo "docker=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set_out python '(\.py$)|(^requirements\.txt$)'
          set_out node   '(\.tsx?$)|(\.jsx?$)|(\.css$)|(^package(-lock)?\.json$)|(^client/src/)|(^client/index\.html$)|(^server/)|(^script/)'
          set_out docker '(^Dockerfile$)|(^\.dockerignore$)|(^package(-lock)?\.json$)|(^requirements\.txt$)|(^run_with_daemon\.sh$)|(\.py$)|(^client/src/)|(^client/index\.html$)|(^server/)|(^script/)'

  python-tests:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check every Python file
        run: python -m compileall -q .

      - name: Run test suite (offline-safe tests)
        # EXCLUSION MECHANISM CORRECTED (Q18, 2026-08-14). This step used to
        # carry an `env:` block setting VOLTRADE_CI beside the note
        # "Network-dependent tests are excluded in CI". The CLAIM is true — but
        # the variable was read by NOTHING repo-wide (D7 found it; grep confirms
        # zero readers), so it attributed a real exclusion to a mechanism that
        # did not exist.
        #
        # The exclusion is done by conftest.py's `collect_ignore`, which drops
        # test_full_system.py and test_auto_discovery.py — standalone scripts
        # that cannot execute under pytest at all (one ends in sys.exit() and
        # kills collection for every other file; the other defines a
        # module-level `def test(phase, name, fn)` helper pytest mis-collects as
        # a test). conftest.py documents that reasoning, and
        # test_collection_health.py guards it.
        #
        # HONEST CAVEAT, since the old note over-promised: the suite is not
        # hermetic. macro_data.py performs live yfinance lookups (DX-Y.NYB,
        # ^TNX) when imported by tests, and those calls do go out. They fail
        # gracefully — the suite passes 1337/1337 with curl reporting connection
        # resets — so this is a latency and noise cost, not a correctness risk.
        # Filed as Q22 to be mocked properly.
        run: |
          python -m pytest -q \
            test_risk_controls.py \
            test_audit_critical.py \
            test_diagnostic_false_positives.py \
            test_patches_verification.py

  node-build:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (ratchet)
        # Was `npx tsc --noEmit || true` with the note "tighten to hard-fail
        # once existing TS errors are cleared". They are now cleared enough to
        # gate: 83 -> 12 across PRs #823/#824/#825, and all 12 remaining are
        # genuine. The rule lives in scripts/tsc_ratchet.sh (mutable, tested by
        # server/tscRatchet.test.ts) so this FROZEN file changes once; the pin
        # lives in ci/tsc_baseline.txt. Authorized by the MASTER PROGRAM, whose
        # §9 names Track 1 as the specific authorization to touch this path.
        run: bash scripts/tsc_ratchet.sh

      - name: Build (client + server bundle)
        run: npm run build

  test:
    # ── MASTER PROGRAM T1.2 — THE TEST GATE. Blocking as of 2026-08-14.
    #
    # T1.1 (#829) got all 368 test files RUNNING here, deliberately
    # non-blocking, to measure a baseline first — turning ~3,586 previously
    # unrun tests into a merge requirement in one step is the failure §12 names
    # outright. The baseline came back at ONE standing failure out of ~3,587
    # (research/test_baseline.md), so the second half is now safe to ship.
    #
    # Every test file is REQUIRED except those listed in ci/quarantine.txt with
    # a reason and a review date. The rule lives in scripts/gated_tests.sh
    # (mutable, tested by server/gatedTests.test.ts) so this FROZEN file gains
    # one `run:` line and every future adjustment happens outside it — the same
    # shape as the typecheck ratchet in node-build.
    #
    # The script also enforces T1.3: the quarantine list may only shrink
    # (pinned in ci/quarantine_max.txt) and no entry may age past 30 days.
    # Quarantined tests still run, non-blocking, so the day one starts passing
    # is visible rather than silently overdue.
    #
    # Authorized by the MASTER PROGRAM, whose §9 names Track 1 as the specific
    # authorization to touch this path.
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (node)
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (python)
        run: |
          pip install -r requirements.txt
          # requirements-dev.txt is the repo's declared "session-run /
          # test-only Python deps" list, and the test suite is precisely what
          # needs it. Without it, test_grid_county_ba.py cannot import openpyxl
          # and the resulting COLLECTION error aborts the whole run — pytest
          # reports `1 skipped, 1 error` in 4s instead of 1337 passes in 64s.
          # It also takes down test_collection_health.py, the repo's own canary
          # for exactly this condition.
          #
          # Deliberately NOT solved by moving openpyxl into requirements.txt:
          # that file is what the frozen Dockerfile installs into the Railway
          # image, and requirements-dev.txt's own header records that nothing
          # in it belongs on a runtime path. The gap was never a missing
          # declaration — it was CI not installing a file that already existed.
          pip install -r requirements-dev.txt

      - name: Counter ratchet (§4.2)
        # scripts/program_status.sh has measured 22 counters since #822, but
        # only when a human typed the command — so commented_empty_catch drifted
        # 112 -> 113 from a concurrent merge and nothing noticed. Measured is not
        # enforced; this enforces. Pins live in ci/counter_baseline.txt, the rule
        # in scripts/counter_ratchet.sh (tested by server/counterRatchet.test.ts).
        # Runs BEFORE the suites: it is seconds, and a counter regression should
        # not wait three minutes to surface.
        run: bash scripts/counter_ratchet.sh

      - name: Test gate (server + client + python, minus quarantine)
        # One step, three suites, all run even when an earlier one fails — a
        # baseline you can only see a third of is not a baseline, and the same
        # is true of a gate. Exits non-zero on any required failure, on a grown
        # quarantine, or on an overdue quarantine entry (T1.3).
        run: bash scripts/gated_tests.sh

  docker-build:
    # Proves the exact image Railway will build actually builds. Layer-cached
    # via actions/cache + buildx local cache so unchanged layers are restored,
    # not rebuilt. Uses only GitHub-owned actions + the runner's own buildx.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: |
            buildx-

      - name: Build Docker image (layer-cached)
        run: |
          set -eu
          docker buildx create --use --name ci-builder 2>/dev/null || docker buildx use ci-builder
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag voltradeai-ci:latest \
            --load \
            .
          # atomically swap the cache so it never grows unbounded
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  automerge:
    # Closes the autonomy loop safely: `needs` blocks this until every heavy
    # job has settled. A SKIPPED heavy job (path-filtered out) is "nothing to
    # check" → still mergeable; a FAILED or CANCELLED one blocks the merge, so
    # skipping can never merge past a real failure. No branch-protection rules
    # needed.
    name: Auto-merge Claude PRs
    # `test` now BLOCKS (T1.2, 2026-08-14). Under T1.1 it was in `needs` but
    # deliberately absent from the `if:` — it waited, reported, and could not
    # stop a merge. That was the measure-first contract; the baseline came back
    # at one standing failure in ~3,587, so it is now a real gate alongside the
    # other three. A SKIPPED test job (path-filtered out) still merges, same as
    # every other heavy job; only failure or cancellation blocks.
    needs: [changes, python-tests, node-build, docker-build, test]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      needs.changes.result == 'success' &&
      needs.python-tests.result != 'failure' && needs.python-tests.result != 'cancelled' &&
      needs.node-build.result != 'failure' && needs.node-build.result != 'cancelled' &&
      needs.docker-build.result != 'failure' && needs.docker-build.result != 'cancelled' &&
      needs.test.result != 'failure' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR (squash)
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
