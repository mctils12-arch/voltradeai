# .github/workflows/ci.yml
# CI gate for VolTradeAI. Runs on every push and PR.
# Railway should deploy only after this passes (enable "Wait for CI"
# in Railway service settings → GitHub → Check Suites).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check every Python file
        run: python -m compileall -q .

      - name: Run test suite (offline-safe tests)
        # Network-dependent tests are excluded in CI; they run in the
        # agent's session against live APIs instead.
        env:
          VOLTRADE_CI: "1"
        run: |
          python -m pytest -q \
            test_risk_controls.py \
            test_audit_critical.py \
            test_diagnostic_false_positives.py \
            test_patches_verification.py

  node-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit || true   # tighten to hard-fail once existing TS errors are cleared

      - name: Build (client + server bundle)
        run: npm run build

  docker-build:
    # Proves the exact image Railway will build actually builds.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t voltradeai-ci .

  automerge:
    # Closes the autonomy loop safely: the `needs` gate means this job cannot
    # run until ALL CI jobs above have passed, so a claude/* PR can never merge
    # ahead of (or despite) failing checks — no branch-protection rules needed.
    # Replaces the old standalone automerge.yml, which enabled auto-merge at
    # PR-open time and merged ungated when main had no required checks.
    name: Auto-merge Claude PRs
    needs: [python-tests, node-build, docker-build]
    if: >
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR (squash)
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
